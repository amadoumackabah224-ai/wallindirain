# Déploiement de TEST sur Render (offre gratuite) : voir docs/HEBERGEMENT-TEST.md
# La base PostgreSQL est externe (ex. Neon) : son adresse est saisie à la main dans DATABASE_URL.
services:
  - type: web
    name: wallindirain
    runtime: docker
    plan: free
    dockerfilePath: ./ops/Dockerfile
    dockerContext: .
    dockerCommand: node src/hosted-start.js
    healthCheckPath: /api/public/info
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CONTACT_PHONE
        value: "624390707"
      - key: MESSAGE_PROVIDER
        value: simulated
      # TEST : rien n'est réellement envoyé, donc les codes (retrait, mot de passe oublié) sont lisibles par
      # l'administrateur dans Journal > Messages. À retirer avant la mise en service réelle.
      - key: SHOW_TEST_CODES
        value: "1"
      # Identité de l'éditeur : affichée dans les mentions légales. Tant qu'un champ est vide, la page affiche « À COMPLÉTER ».
      # À renseigner dans le tableau de bord Render (Environment) : rien d'inventé n'est publié.
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_FORM
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: LEGAL_RCCM
        sync: false
      - key: LEGAL_NIF
        sync: false
      - key: LEGAL_DIRECTOR
        sync: false
      - key: HOSTING_REGION
        sync: false
      - key: LEGAL_RETURN_DAYS
        value: "2"
      - key: DB_APP_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
